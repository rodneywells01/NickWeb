; Load at PHP startup for the WEB SAPI, then restart every PHP worker.
; Copy to the web SAPI's scanned conf.d directory or merge into its php.ini.
; NOT an application include or .user.ini. Requires a patched PHP interpreter.
session.upload_progress.enabled = 0
file_uploads = Off
post_max_size = 8M
upload_max_filesize = 2M
max_input_vars = 1000
max_input_nesting_level = 32
; Effective on PHP 8.5. No application feature depends on fatal backtraces.
fatal_error_backtraces = 0
