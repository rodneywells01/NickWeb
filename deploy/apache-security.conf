# Apache 2.4 + mod_rewrite: include INSIDE each website VirtualHost (HTTP and HTTPS).
# This is an example for operator review, not an automatic deployment.
# Keep existing handler, TLS, DocumentRoot and database configuration.
LimitRequestBody 8388608
LimitRequestFields 100
LimitRequestFieldSize 8190

# The site has no uploads; reject multipart before it reaches the PHP handler.
RewriteEngine On
RewriteCond %{HTTP:Content-Type} ^[[:space:]]*multipart/ [NC]
RewriteRule ^ - [F,L]

# Internal helpers, tooling, repository metadata and deployment files are not URLs.
<LocationMatch "(?i)(?:^|/)(?:includes|deploy|docs|tests|tools|\.git)(?:/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)^(?:emailtest|test)\.php$">
    Require all denied
</FilesMatch>
